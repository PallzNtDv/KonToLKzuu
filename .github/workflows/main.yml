name: Build Kernel & Tools (Automated Pipeline)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Pilih Target Build'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'kernel_only'
          - 'manager_only'
      ksu_fork:
        description: 'Pilih Fork KernelSU'
        required: true
        type: choice
        default: 'xxKSU'
        options:
          - 'xxKSU'
          - 'SUKISU'
          - 'KSU-Next'
          - 'Official'
      manifest_name:
        description: 'Pilih Manifest XML Device'
        required: true
        type: choice
        options:
          - camellia
          - flyme-test
          - vortex-v1
          - lineage-23.2
      include_susfs:
        description: 'Sertakan SUSFS (Kernel Anti-Detection)'
        required: true
        type: boolean
        default: true
      include_bbg:
        description: 'Sertakan Baseband-Guard (BBG)'
        required: true
        type: boolean
        default: true
      toolchain:
        description: 'Pilih Toolchain Clang'
        required: true
        type: choice
        default: 'proton-clang'
        options:
          - 'proton-clang'
          - 'aosp-clang'
          - 'zyc-clang'
          - 'azure-clang'
          - 'eva-gcc'

      # =========================================================================
      # INDIVIDUAL KERNEL-SIDE FEATURE TOGGLES
      # =========================================================================
      include_lto_o3:
        description: 'Enable ThinLTO & -O3 Compiler Optimizations'
        required: true
        type: boolean
        default: true
      include_wireguard:
        description: 'Inject WireGuard VPN Protocol'
        required: true
        type: boolean
        default: true
      include_f2fs:
        description: 'Inject F2FS Backport for 4.14'
        required: true
        type: boolean
        default: true
      include_zstd:
        description: 'Enable ZRAM ZSTD Compression'
        required: true
        type: boolean
        default: true
      include_bbr:
        description: 'Enable TCP BBR & Westwood Congestion Control'
        required: true
        type: boolean
        default: true
      include_ttl:
        description: 'Enable TTL / HL Packet Spoofing'
        required: true
        type: boolean
        default: true
        
permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: OTOMATIS MEMANGGIL WORKER KERNEL & MANAGER
  # -------------------------------------------------------------------------
  build-kernel-and-manager:
    uses: ./.github/workflows/build-kernel.yml
    with:
      build_target: ${{ inputs.build_target }}
      ksu_fork: ${{ inputs.ksu_fork }}
      manifest_name: ${{ inputs.manifest_name }}
      include_susfs: ${{ inputs.include_susfs }}
      include_bbg: ${{ inputs.include_bbg }}
      toolchain: ${{ inputs.toolchain }}
    secrets: inherit

  # -------------------------------------------------------------------------
  # JOB 2: OTOMATIS MEMANGGIL WORKER LPUD (Jika xxKSU / SUKISU dipilih)
  # -------------------------------------------------------------------------
  build-lpud-binary:
    if: inputs.ksu_fork == 'xxKSU' || inputs.ksu_fork == 'SUKISU'
    uses: ./.github/workflows/build-lpud.yml
    with:
      ksu_fork: ${{ inputs.ksu_fork }}
      target_arch: 'aarch64-linux-android'
    secrets: inherit
    
