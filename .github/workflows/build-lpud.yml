name: Build lpud Binary

on:
  # 1. Bisa dijalankan manual via UI Actions
  workflow_dispatch:
    inputs:
      ksu_fork:
        description: 'Pilih Fork KernelSU'
        required: true
        type: choice
        default: 'xxKSU'
        options:
          - 'xxKSU'
          - 'SUKISU'
      target_arch:
        description: 'Target Arsitektur'
        required: true
        type: choice
        default: 'aarch64-linux-android'
        options:
          - 'aarch64-linux-android'

  # 2. Bisa dipanggil dari workflow lain (Caller)
  workflow_call:
    inputs:
      ksu_fork:
        required: true
        type: string
      target_arch:
        required: false
        type: string
        default: 'aarch64-linux-android'

permissions:
  contents: write

jobs:
  build-lpud:
    if: inputs.ksu_fork == 'xxKSU' || inputs.ksu_fork == 'SUKISU'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target_arch || 'aarch64-linux-android' }}

      - name: Clone KSU Userspace Source
        run: |
          rm -rf ksu-src
          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Cloning xxKSU Userspace..."
            git clone --depth=1 https://github.com/backslashxx/KernelSU.git ksu-src
          else
            echo "Cloning SUKISU Userspace..."
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git ksu-src
          fi

      - name: Setup Cross Compiler
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1 --force

      - name: Build lpud
        run: |
          if [ -d "ksu-src/userspace/lpud" ]; then
            cd ksu-src
            CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target_arch || 'aarch64-linux-android' }} --release --manifest-path ./userspace/lpud/Cargo.toml
            mkdir -p ../output_lpud
            cp target/${{ inputs.target_arch || 'aarch64-linux-android' }}/release/lpud ../output_lpud/lpud-aarch64
          else
            echo "Error: Folder userspace/lpud tidak ditemukan di repositori ini!"
            exit 1
          fi

      - name: Upload lpud Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpud-${{ inputs.ksu_fork }}-${{ inputs.target_arch || 'aarch64-linux-android' }}
          path: output_lpud/lpud-aarch64

      - name: Publish to GitHub Release (Manual Execution)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lpud-${{ inputs.ksu_fork }}-${{ github.run_number }}
          name: "lpud Binary - ${{ inputs.ksu_fork }} (#${{ github.run_number }})"
          body: |
            ### 🛠️ lpud Binary Release
            - **KSU Fork**: `${{ inputs.ksu_fork }}`
            - **Architecture**: `${{ inputs.target_arch || 'aarch64-linux-android' }}`
          files: |
            output_lpud/lpud-aarch64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
