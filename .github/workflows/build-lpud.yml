      - name: Build lpud / ksud
        run: |
          cd ksu-src

          # Cari lokasi Cargo.toml (lpud atau ksud) secara otomatis
          CARGO_PATH=$(find . -maxdepth 3 -name "Cargo.toml" | grep -E "lpud|ksud" | head -n 1)

          if [ -z "$CARGO_PATH" ]; then
            # Fallback jika tidak terdeteksi spesifik, cari Cargo.toml apa saja di folder userspace
            CARGO_PATH=$(find userspace -name "Cargo.toml" 2>/dev/null | head -n 1)
          fi

          if [ -n "$CARGO_PATH" ]; then
            echo "Menemukan project Rust di lokasi: $CARGO_PATH"
            
            TARGET_ARCH="${{ inputs.target_arch || 'aarch64-linux-android' }}"
            
            CROSS_NO_WARNINGS=0 cross build --target "$TARGET_ARCH" --release --manifest-path "$CARGO_PATH"

            mkdir -p ../output_lpud

            # Cari binary hasil kompilasi (lpud atau ksud)
            BINARY_FILE=$(find "target/$TARGET_ARCH/release/" -maxdepth 1 -type f \( -name "lpud*" -o -name "ksud*" \) ! -name "*.d" | head -n 1)

            if [ -n "$BINARY_FILE" ]; then
              echo "Berhasil mem-build: $BINARY_FILE"
              cp "$BINARY_FILE" ../output_lpud/lpud-aarch64
            else
              echo "Error: Binary hasil kompilasi tidak ditemukan di folder target!"
              exit 1
            fi
          else
            echo "Error: File Cargo.toml untuk lpud/ksud tidak ditemukan!"
            echo "Isi struktur repositori:"
            ls -la
            exit 1
          fi
          
