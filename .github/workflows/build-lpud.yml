name: Build lpud Binary

on:
  workflow_dispatch:
    inputs:
      ksu_fork:
        description: 'Pilih Fork KernelSU'
        required: true
        type: choice
        default: 'xxKSU'
        options:
          - 'xxKSU'
          - 'SUKISU'
          - 'ReSuKISU'
      target_arch:
        description: 'Target Arsitektur'
        required: true
        type: choice
        default: 'aarch64-linux-android'
        options:
          - 'aarch64-linux-android'

  workflow_call:
    inputs:
      ksu_fork:
        required: true
        type: string
      target_arch:
        required: false
        type: string
        default: 'aarch64-linux-android'

permissions:
  contents: write

jobs:
  build-lpud:
    if: inputs.ksu_fork == 'xxKSU' || inputs.ksu_fork == 'SUKISU' || inputs.ksu_fork == 'ReSuKISU'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target_arch || 'aarch64-linux-android' }}

      - name: Clone KSU Userspace Source
        run: |
          rm -rf ksu-src
          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Cloning xxKSU Userspace..."
            git clone --depth=1 https://github.com/backslashxx/KernelSU.git ksu-src
          elif [ "${{ inputs.ksu_fork }}" = "ReSuKISU" ]; then
            echo "Cloning ReSuKISU Userspace..."
            git clone --depth=1 https://github.com/rsuntk/ReSuKISU.git ksu-src
          else
            echo "Cloning SUKISU Userspace..."
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git ksu-src
          fi

      - name: Setup Cross Compiler
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1 --force

      - name: Build lpud / ksud
        run: |
          cd ksu-src

          # Cari lokasi Cargo.toml (lpud atau ksud) secara otomatis
          CARGO_PATH=$(find . -maxdepth 3 -name "Cargo.toml" | grep -E "lpud|ksud" | head -n 1)

          if [ -z "$CARGO_PATH" ]; then
            # Fallback jika tidak terdeteksi spesifik, cari Cargo.toml apa saja di folder userspace
            CARGO_PATH=$(find userspace -name "Cargo.toml" 2>/dev/null | head -n 1)
          fi

          if [ -n "$CARGO_PATH" ]; then
            echo "Menemukan project Rust di lokasi: $CARGO_PATH"
            
            TARGET_ARCH="${{ inputs.target_arch || 'aarch64-linux-android' }}"
            
            CROSS_NO_WARNINGS=0 cross build --target "$TARGET_ARCH" --release --manifest-path "$CARGO_PATH"

            mkdir -p ../output_lpud

            # Cari binary hasil kompilasi (lpud atau ksud)
            BINARY_FILE=$(find "target/$TARGET_ARCH/release/" -maxdepth 1 -type f \( -name "lpud*" -o -name "ksud*" \) ! -name "*.d" | head -n 1)

            if [ -n "$BINARY_FILE" ]; then
              echo "Berhasil mem-build: $BINARY_FILE"
              cp "$BINARY_FILE" ../output_lpud/lpud-aarch64
            else
              echo "Error: Binary hasil kompilasi tidak ditemukan di folder target!"
              exit 1
            fi
          else
            echo "Error: File Cargo.toml untuk lpud/ksud tidak ditemukan!"
            echo "Isi struktur repositori:"
            ls -la
            exit 1
          fi

      - name: Upload lpud Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpud-${{ inputs.ksu_fork }}-${{ inputs.target_arch || 'aarch64-linux-android' }}
          path: output_lpud/lpud-aarch64

      - name: Publish to GitHub Release (Manual Execution)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lpud-${{ inputs.ksu_fork }}-${{ github.run_number }}
          name: "lpud Binary - ${{ inputs.ksu_fork }} (#${{ github.run_number }})"
          body: |
            ### 🛠️ lpud Binary Release
            - **KSU Fork**: `${{ inputs.ksu_fork }}`
            - **Architecture**: `${{ inputs.target_arch || 'aarch64-linux-android' }}`
          files: |
            output_lpud/lpud-aarch64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
