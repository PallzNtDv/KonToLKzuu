name: Flexible Upstream Dependency Watcher

on:
  schedule:
    # Running daily at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Web UI

permissions:
  contents: read
  variables: write

jobs:
  check-all-upstreams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check All Upstream Repositories
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          REPO_NAME: "${{ github.repository }}"
        run: |
          python3 << 'EOF'
          import os, json, subprocess, urllib.request, urllib.parse

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          my_repo = os.environ.get("REPO_NAME", "")
          gh_token = os.environ.get("GITHUB_TOKEN", "")

          # 🎯 DAFTAR REPOSITORI BEBAS YANG INGIN DIPANTAU
          # Format: {"nama": "...", "url": "...", "branch": "...", "var": "NAMA_VAR_DI_GITHUB"}
          TARGETS = [
              {
                  "name": "KernelSU-Next",
                  "url": "https://github.com/rifs28/KernelSU-Next.git",
                  "branch": "main",
                  "var": "LAST_KSUNEXT_COMMIT"
              },
              {
                  "name": "Official KernelSU",
                  "url": "https://github.com/tiann/KernelSU.git",
                  "branch": "main",
                  "var": "LAST_OFFICIAL_KSU_COMMIT"
              },
              {
                  "name": "Baseband-Guard",
                  "url": "https://github.com/vc-teahouse/Baseband-guard.git",
                  "branch": "main",
                  "var": "LAST_BBG_COMMIT"
              }
          ]

          # Fungsi untuk mengambil Repository Variable dari GitHub API
          def get_gh_variable(var_name):
              try:
                  cmd = f"gh variable get {var_name}"
                  res = subprocess.check_output(cmd, shell=True, stderr=subprocess.DEVNULL).decode().strip()
                  return res
              except Exception:
                  return "initial"

          # Fungsi untuk memperbarui Repository Variable di GitHub
          def set_gh_variable(var_name, value):
              try:
                  cmd = f"gh variable set {var_name} --body '{value}'"
                  subprocess.run(cmd, shell=True, check=True)
                  print(f"✅ Variable {var_name} updated successfully.")
              except Exception as e:
                  print(f"❌ Failed to set variable {var_name}:", e)

          for target in TARGETS:
              name = target["name"]
              url = target["url"]
              branch = target["branch"]
              var_name = target["var"]

              print(f"\n🔍 Checking {name} ({url})...")

              # Get latest commit hash from remote git
              try:
                  git_cmd = f"git ls-remote {url} refs/heads/{branch}"
                  output = subprocess.check_output(git_cmd, shell=True).decode().strip()
                  if not output:
                      continue
                  latest_hash = output.split()[0]
              except Exception as e:
                  print(f"⚠️ Failed to fetch {name}:", e)
                  continue

              prev_hash = get_gh_variable(var_name)
              short_hash = latest_hash[:7]

              print(f"Current Remote Hash : {latest_hash}")
              print(f"Previous Stored Hash: {prev_hash}")

              if latest_hash != prev_hash:
                  print(f"🚀 New update found for {name}!")

                  # Update GitHub Variable
                  set_gh_variable(var_name, latest_hash)

                  # Kirim Notifikasi Telegram
                  if token and chat_id:
                      clean_url = url.replace(".git", "")
                      commit_url = f"{clean_url}/commit/{latest_hash}"
                      action_url = f"https://github.com/{my_repo}/actions/workflows/build-kernel.yaml"

                      text = (
                          f"🔔 *New Upstream Update Detected!*\n\n"
                          f"📦 *Project:* `{name}`\n"
                          f"🔑 *Commit:* [{short_hash}]({commit_url})\n\n"
                          f"💡 *Action:* Click buttons below to check commit or start building."
                      )

                      reply_markup = {
                          "inline_keyboard": [
                              [
                                  {"text": "📜 View Commit", "url": commit_url},
                                  {"text": "🚀 Run Build Now", "url": action_url}
                              ]
                          ]
                      }

                      data = urllib.parse.urlencode({
                          "chat_id": chat_id,
                          "text": text,
                          "parse_mode": "Markdown",
                          "reply_markup": json.dumps(reply_markup),
                          "disable_web_page_preview": "true"
                      }).encode()

                      req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
                      try:
                          urllib.request.urlopen(req)
                          print(f"✅ Telegram alert sent for {name}.")
                      except Exception as e:
                          print("❌ Telegram error:", e)
              else:
                  print(f"✅ {name} is up to date.")
          EOF

