name: Build Kernel & Manager Worker

on:
  workflow_call:
    inputs:
      build_target:
        required: true
        type: string
      ksu_fork:
        required: true
        type: string
      manifest_name:
        required: true
        type: string
      include_susfs:
        required: true
        type: boolean
      include_bbg:
        required: true
        type: boolean
      toolchain:
        required: true
        type: string
      include_lto_o3:
        required: false
        type: boolean
      include_wireguard:
        required: false
        type: boolean
      include_f2fs:
        required: false
        type: boolean
      include_zstd:
        required: false
        type: boolean
      include_bbr:
        required: false
        type: boolean
      include_ttl:
        required: false
        type: boolean
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: BUILD KERNEL
  # =========================================================================
  build-kernel:
    if: inputs.build_target == 'both' || inputs.build_target == 'kernel_only'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: "arm64"
      KERNEL_DEFCONFIG: "camellia_defconfig"

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Telegram Build Start Notification ---
      - name: Send Telegram Start Notification
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST: "${{ inputs.manifest_name }}"
          TARGET: "${{ inputs.build_target }}"
          KSU: "${{ inputs.ksu_fork }}"
          TOOLCHAIN: "${{ inputs.toolchain }}"
          SUSFS: "${{ inputs.include_susfs }}"
          BBG: "${{ inputs.include_bbg }}"
          RUN_NUM: "${{ github.run_number }}"
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST", "")
          target = os.environ.get("TARGET", "")
          ksu = os.environ.get("KSU", "")
          toolchain = os.environ.get("TOOLCHAIN", "")
          susfs = os.environ.get("SUSFS", "")
          bbg = os.environ.get("BBG", "")
          run_num = os.environ.get("RUN_NUM", "")

          if token and chat_id:
              text = f"⚡ *LinuxxPU Build Engine Initialized*\n\n📱 *Device:* {manifest}\n🎯 *Target:* {target}\n🔑 *KSU Engine:* {ksu}\n🛠️ *Toolchain:* {toolchain}\n🛡️ *SUSFS:* {susfs}\n🔰 *Baseband-Guard:* {bbg}\n🔢 *Build Run:* #{run_num}\n\n⚙️ *Status:* Compiling kernel source..."
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print("Telegram notification error:", e)
          EOF

      - name: Setup Build Dependencies
        run: |
          sudo apt purge -y man-db /var/lib/man-db/auto-update || true
          sudo apt update -qq
          sudo apt install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip unzip git ccache curl aria2 jq

      - name: Download Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain

          case "${{ inputs.toolchain }}" in
            "proton-clang")
              echo "Downloading Proton-Clang..."
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
              ;;
            "zyc-clang")
              echo "Downloading ZyC Clang..."
              URL=$(curl -sSL -H "User-Agent: Mozilla/5.0" "https://gitlab.com/api/v4/projects/28003182/releases" | jq -r '.[0].assets.links[]?.url // .[0].description // empty' 2>/dev/null | grep -oE 'https://[^\s"\)]+\.tar\.(gz|xz)' | head -n 1)

              if [ -z "$URL" ]; then
                echo "⚠️ Release API blocked, attempting GitLab Package Registry..."
                PKG_DATA=$(curl -sSL -H "User-Agent: Mozilla/5.0" "https://gitlab.com/api/v4/projects/28003182/packages")
                PKG_ID=$(echo "$PKG_DATA" | jq -r '.[0].id // empty' 2>/dev/null)
                PKG_VER=$(echo "$PKG_DATA" | jq -r '.[0].version // empty' 2>/dev/null)

                if [ -n "$PKG_ID" ] && [ -n "$PKG_VER" ]; then
                  FILE_NAME=$(curl -sSL -H "User-Agent: Mozilla/5.0" "https://gitlab.com/api/v4/projects/28003182/packages/$PKG_ID/package_files" | jq -r '.[0].file_name // empty' 2>/dev/null)
                  [ -n "$FILE_NAME" ] && URL="https://gitlab.com/api/v4/projects/28003182/packages/generic/ZyC-Clang/$PKG_VER/$FILE_NAME"
                fi
              fi

              SUCCESS=false
              if [ -n "$URL" ]; then
                echo "🔗 Downloading from: $URL"
                curl -sSL -H "User-Agent: Mozilla/5.0" "$URL" -o zyc-clang.archive || true
                
                if tar -tf zyc-clang.archive >/dev/null 2>&1; then
                  echo "✅ ZyC Clang downloaded and verified!"
                  mkdir clang
                  tar -xf zyc-clang.archive -C clang --strip-components=1 2>/dev/null || tar -xf zyc-clang.archive -C clang
                  rm -f zyc-clang.archive
                  SUCCESS=true
                fi
              fi

              if [ "$SUCCESS" = false ]; then
                echo "⚠️ ZyC Clang failed/blocked. Fallback to Official AOSP Clang..."
                rm -rf clang zyc-clang.archive
                wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
                mkdir clang && tar -xf clang-r383902.tar.gz -C clang
                rm -f clang-r383902.tar.gz
              fi
              ;;
            "azure-clang")
              echo "Downloading Azure Clang..."
              git clone --depth=1 https://github.com/P3RF3CT-ST34LTH/azure-clang.git clang
              ;;
            "eva-clang")
              echo "Downloading Eva GCC / Clang..."
              git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git clang
              ;;
            *)
              echo "Downloading Official AOSP Clang..."
              wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
              mkdir clang && tar -xf clang-r383902.tar.gz -C clang
              rm -f clang-r383902.tar.gz
              ;;
          esac
          
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Sync Kernel Source from Manifest
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          export PATH=~/.bin:$PATH

          SEARCH_TARGET="${{ inputs.manifest_name }}.xml"
          FOUND_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -iname "$SEARCH_TARGET" | head -n 1)

          if [ -z "$FOUND_FILE" ] || [ ! -f "$FOUND_FILE" ]; then
            echo "::error::File $SEARCH_TARGET NOT FOUND in repository!"
            exit 1
          fi

          MANIFEST_PATH="$FOUND_FILE"
          echo "✅ Using manifest from: $MANIFEST_PATH"

          mkdir -p local-manifest
          cp "$MANIFEST_PATH" local-manifest/default.xml
          cd local-manifest
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add default.xml
          git commit -m "Local manifest init"
          git branch -M main
          cd ..

          repo init -u ./local-manifest -b main
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Generate Kernel Changelog & Build Metadata
        run: |
          mkdir -p output_meta
          
          # 1. Capture 7 latest commits from kernel source
          echo "#### 📝 Recent Kernel Commits" > output_meta/changelog.txt
          if [ -d "kernel-source" ]; then
            cd kernel-source
            git log -n 7 --pretty=format:"* %h - %s (%an)" >> ../output_meta/changelog.txt
            cd ..
          else
            echo "* No commit log available" >> output_meta/changelog.txt
          fi

          echo "" >> output_meta/changelog.txt
          echo "#### 🛠️ Toolchain Details" >> output_meta/changelog.txt
          
          # 2. Capture Compiler Version
          CLANG_VER=$($GITHUB_WORKSPACE/toolchain/clang/bin/clang --version | head -n 1)
          echo "* **Compiler**: \`$CLANG_VER\`" >> output_meta/changelog.txt
          
      - name: Setup KSU Fork ("${{ inputs.ksu_fork }}")
        run: |
          cd kernel-source
          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Setting up xxKSU..."
            curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/main/kernel/setup.sh" | bash -s main || \
            curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
          elif [ "${{ inputs.ksu_fork }}" = "SUKISU" ]; then
            echo "Setting up SUKISU..."
            curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || \
            curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/master/kernel/setup.sh" | bash -s master
          else
            echo "Setting up Official KernelSU..."
            curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main || \
            curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/master/kernel/setup.sh" | bash -s master
          fi

          HOOK_FILE="drivers/kernelsu/core_hook.c"
          if [ -f "$HOOK_FILE" ]; then
            echo "Patching core_hook.c for Non-GKI manual hooks..."
            sed -i 's/#ifdef CONFIG_KPROBES/#if 0/g' "$HOOK_FILE"
          fi

      - name: Apply Manual Hooks for Official KSU (4.14 Non-GKI)
        if: inputs.ksu_fork == 'Official'
        run: |
          cd kernel-source
          echo "Applying Manual Hooks for Official KSU on 4.14..."
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          if [ -f "../patches/ksu_manual_hooks_4.14.patch" ]; then
            patch -p1 < ../patches/ksu_manual_hooks_4.14.patch
          fi

      - name: Apply Baseband-Guard (BBG)
        if: inputs.include_bbg == true
        run: |
          cd kernel-source
          echo "Applying Baseband-guard..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || true
          echo "CONFIG_BBG=y" >> arch/arm64/configs/$KERNEL_DEFCONFIG

      - name: Apply SUSFS Patch & Configs
        if: inputs.include_susfs == true
        run: |
          cd kernel-source
          echo "Applying SUSFS 4.14 Patch & Configs..."
          if [ -d "../patches/susfs_4.14" ]; then
            cp -r ../patches/susfs_4.14/* .
          fi

          DEFCONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG_FILE

      - name: Inject Selected Kernel Features
        uses: ./.github/actions/inject-features
        with:
          defconfig: ${{ env.KERNEL_DEFCONFIG }}
          enable_lto_o3: ${{ inputs.include_lto_o3 }}
          enable_wireguard: ${{ inputs.include_wireguard }}
          enable_f2fs: ${{ inputs.include_f2fs }}
          enable_zstd: ${{ inputs.include_zstd }}
          enable_bbr: ${{ inputs.include_bbr }}
          enable_ttl: ${{ inputs.include_ttl }}

      - name: Configure Kernel Defconfig
        run: |
          cd kernel-source
          DEFCONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG_FILE
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG_FILE

      - name: Setup & Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ inputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.toolchain }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.cache/ccache
          ccache -M 5G
          ccache -o compression=true
          ccache -z

      - name: Build Kernel Image
        run: |
          cd kernel-source

          rm -f $GITHUB_WORKSPACE/toolchain/clang/bin/ld
          
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export CCACHE_DIR=~/.cache/ccache
          
          make O=out ARCH=${{ env.ARCH }} $KERNEL_DEFCONFIG
          
          make -j$(nproc --all) O=out \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld

          echo "=================================================="
          echo "📊 CCACHE STATS"
          echo "=================================================="
          ccache -s

      - name: Package AnyKernel3 & Generate SHA256
        run: |
          if [ ! -d "AnyKernel3" ]; then
            echo "📥 Cloning AnyKernel3 repository..."
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi

          cd AnyKernel3

          if [ -f "../kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f "../kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz .
          else
            echo "❌ Error: Image.gz / Image.gz-dtb file not found!"
            exit 1
          fi

          DATE_TAG=$(date +'%Y%m%d-%H%M')
          KERNEL_NAME="LinuxxPU"
          DEVICE="Camellia"
          TOOLCHAIN="${{ inputs.toolchain }}"

          FEATURE_TAGS=""
          [ -n "${{ inputs.ksu_fork }}" ] && FEATURE_TAGS="${FEATURE_TAGS}-${{ inputs.ksu_fork }}"
          [ "${{ inputs.include_susfs }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-SUSFS"
          [ "${{ inputs.include_bbg }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBG"
          [ "${{ inputs.include_lto_o3 }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-LTO"
          [ "${{ inputs.include_wireguard }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-WG"
          [ "${{ inputs.include_f2fs }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-F2FS"
          [ "${{ inputs.include_zstd }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-ZSTD"
          [ "${{ inputs.include_bbr }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBR"
          [ "${{ inputs.include_ttl }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-TTL"

          ZIP_NAME="${KERNEL_NAME}-${DEVICE}-4.14-${TOOLCHAIN}${FEATURE_TAGS}-${DATE_TAG}.zip"

          zip -r9 "$ZIP_NAME" ./* -x ".git*" "README.md" "*.zip"
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          echo "=================================================="
          echo "📦 Output Zip : $ZIP_NAME"
          echo "🔑 SHA256 Hash: $(awk '{print $1}' "${ZIP_NAME}.sha256")"
          echo "=================================================="

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV
          echo "SHA256_PATH=AnyKernel3/${ZIP_NAME}.sha256" >> $GITHUB_ENV

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-assets
          path: |
            ${{ env.ZIP_PATH }}${{ env.SHA256_PATH }}
            output_meta/changelog.txt
          retention-days: 7

      - name: Send Telegram Failure Notification (Kernel)
        if: failure()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST: "${{ inputs.manifest_name }}"
          KSU: "${{ inputs.ksu_fork }}"
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST", "")
          ksu = os.environ.get("KSU", "")

          if token and chat_id:
              text = f"❌ *Build Kernel Failed!*\n📱 *Device:* {manifest}\n⚙️ *Fork:* {ksu}"
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print("Telegram notification error:", e)
          EOF

  # =========================================================================
  # JOB 2: BUILD MANAGER APP
  # =========================================================================
  build-manager:
    needs: build-kernel
    if: |
      always() && !cancelled() && (
        inputs.build_target == 'both' || inputs.build_target == 'manager_only'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Manager Source Code ("${{ inputs.ksu_fork }}")
        run: |
          clone_repo() {
            local url=$1
            rm -rf manager-src
            echo "📥 Attempting to clone: $url"
            git clone --depth=1 --recurse-submodules "$url" manager-src
          }

          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Cloning xxKSU Manager..."
            clone_repo "https://github.com/rifs28/KernelSU-Next.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          elif [ "${{ inputs.ksu_fork }}" = "SUKISU" ]; then
            echo "Cloning SUKISU Manager..."
            clone_repo "https://github.com/SukiSU-Ultra/SukiSU-Manager.git" || \
            clone_repo "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          elif [ "${{ inputs.ksu_fork }}" = "KSU-Next" ]; then
            echo "Cloning KernelSU-Next Manager..."
            clone_repo "https://github.com/rifs28/KernelSU-Next.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          else
            echo "Cloning Official KernelSU Manager..."
            clone_repo "https://github.com/tiann/KernelSU.git"
          fi

          GW_FILE=$(find manager-src -maxdepth 3 -name "gradlew" 2>/dev/null | head -n 1)

          if [ ! -d "manager-src" ] || [ -z "$GW_FILE" ]; then
            echo "❌ Error: Failed to clone a valid Manager repository or gradlew missing!"
            exit 1
          fi

          echo "✅ Manager repository successfully cloned!"

      - name: Setup Java JDK 21 & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: 'manager-src/**/*.gradle*'

      - name: Build Manager APK via Gradle
        run: |
          GW_FILE=$(find manager-src -maxdepth 3 -name "gradlew" 2>/dev/null | head -n 1)

          if [ -z "$GW_FILE" ]; then
            echo "❌ Error: gradlew file not found in manager-src!"
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GW_FILE")
          echo "✅ Gradle project location found at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Organize APK Artifact
        run: |
          mkdir -p output_apk

          if [ ! -d "manager-src" ]; then
            echo "❌ Error: Directory 'manager-src' not found! Previous clone step might have failed."
            exit 1
          fi

          APK_FILE=$(find manager-src -name "*.apk" | grep -i "release" | head -n 1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "✅ APK found at: $APK_FILE"
            cp "$APK_FILE" "output_apk/${{ inputs.ksu_fork }}-Manager-Release.apk"
          else
            echo "❌ Error: Compiled APK file not found!"
            exit 1
          fi

      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-assets
          path: "output_apk/${{ inputs.ksu_fork }}-Manager-Release.apk"

      - name: Send Telegram Failure Notification (Manager)
        if: failure()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          KSU: "${{ inputs.ksu_fork }}"
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          ksu = os.environ.get("KSU", "")

          if token and chat_id:
              text = f"❌ *Manager Build Failed!*\n⚙️ *Fork:* {ksu}"
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print("Telegram notification error:", e)
          EOF

      - name: Cancel Entire Workflow on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "❌ Manager build failed! Cancelling entire workflow..."
          gh run cancel ${{ github.run_id }}

  # =========================================================================
  # JOB 3: PUBLISH TO GITHUB RELEASES & TELEGRAM
  # =========================================================================
  publish-release:
    needs: [build-kernel, build-manager]
    if: |
      always() && !cancelled() && (
        (inputs.build_target == 'both' && needs.build-kernel.result == 'success' && needs.build-manager.result == 'success') ||
        (inputs.build_target == 'kernel_only' && needs.build-kernel.result == 'success') ||
        (inputs.build_target == 'manager_only' && needs.build-manager.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Prepare Release Environment
        run: |
          DATE_TAG=$(date +'%Y%m%d-%H%M')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

          ZIP_FILE=$(find release_assets -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            ZIP_NAME=$(basename "$ZIP_FILE")
            echo "RELEASE_TITLE=LinuxxPU Kernel - $ZIP_NAME" >> $GITHUB_ENV
          else
            echo "RELEASE_TITLE=LinuxxPU Build Release v$DATE_TAG" >> $GITHUB_ENV
          fi

          SHA_FILE=$(find release_assets -name "*.sha256" | head -n 1)
          if [ -n "$SHA_FILE" ]; then
            echo "SHA256_CONTENT=$(cat "$SHA_FILE")" >> $GITHUB_ENV
          else
            echo "SHA256_CONTENT=N/A" >> $GITHUB_ENV
          fi

          # 🎯 Read dynamic changelog
          if [ -f "release_assets/changelog.txt" ]; then
            echo "CHANGELOG_BODY<<EOF" >> $GITHUB_ENV
            cat release_assets/changelog.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG_BODY=No changelog available." >> $GITHUB_ENV
          fi

      - name: Auto-Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DATE_TAG }}
          name: "${{ env.RELEASE_TITLE }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ### 🚀 LinuxxPU Build Release
            
            * **Device / Manifest**: `${{ inputs.manifest_name }}`
            * **Kernel Version**: 4.14
            * **Toolchain**: `${{ inputs.toolchain }}`
            * **Build Date**: `${{ env.DATE_TAG }}`

            #### 🛠️ Active Features
            * **KernelSU Engine**: `${{ inputs.ksu_fork }}`
            * **SUSFS**: `${{ inputs.include_susfs }}`
            * **Baseband-Guard**: `${{ inputs.include_bbg }}`
            * **ThinLTO & -O3**: `${{ inputs.include_lto_o3 }}`
            * **WireGuard**: `${{ inputs.include_wireguard }}`
            * **F2FS Backport**: `${{ inputs.include_f2fs }}`
            * **ZRAM ZSTD**: `${{ inputs.include_zstd }}`
            * **TCP BBR**: `${{ inputs.include_bbr }}`
            * **TTL Spoofing**: `${{ inputs.include_ttl }}`

            ---
            ${{ env.CHANGELOG_BODY }}

            ---
            *📦 File SHA256 Checksum:*
            ```text
            ${{ env.SHA256_CONTENT }}
            ```
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Built Files (Kernel & Manager) to Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST: "${{ inputs.manifest_name }}"
          KSU: "${{ inputs.ksu_fork }}"
          LTO: "${{ inputs.include_lto_o3 }}"
          WG: "${{ inputs.include_wireguard }}"
          F2FS: "${{ inputs.include_f2fs }}"
          ZSTD: "${{ inputs.include_zstd }}"
          BBR: "${{ inputs.include_bbr }}"
          TTL: "${{ inputs.include_ttl }}"
        run: |
          python3 << 'EOF'
          import os, glob, subprocess

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST", "")
          ksu = os.environ.get("KSU", "")

          lto = os.environ.get("LTO") == "true"
          wg = os.environ.get("WG") == "true"
          f2fs = os.environ.get("F2FS") == "true"
          zstd = os.environ.get("ZSTD") == "true"
          bbr = os.environ.get("BBR") == "true"
          ttl = os.environ.get("TTL") == "true"

          features = []
          if lto: features.append("⚡ ThinLTO & -O3")
          if wg: features.append("🛡️ WireGuard")
          if f2fs: features.append("📁 F2FS Backport")
          if zstd: features.append("🗜️ ZRAM ZSTD")
          if bbr: features.append("🌐 TCP BBR")
          if ttl: features.append("📡 TTL Spoofing")

          feature_str = "\n".join([f"  • {f}" for f in features]) if features else "  • Default Configuration"

          if token and chat_id:
              zips = glob.glob("release_assets/*.zip")
              for zip_file in zips:
                  name = os.path.basename(zip_file)
                  size = subprocess.check_output(["du", "-h", zip_file]).decode().split()[0]
                  
                  sha_file = zip_file + ".sha256"
                  sha_hash = "N/A"
                  if os.path.exists(sha_file):
                      with open(sha_file, "r") as f:
                          sha_hash = f.read().strip().split()[0]

                  caption = (
                      f"⚡ *LinuxxPU Kernel Ready!*\n\n"
                      f"📱 *Device:* {manifest}\n"
                      f"⚙️ *KSU Engine:* {ksu}\n"
                      f"🛠️ *Active Features:*\n{feature_str}\n\n"
                      f"📦 *File:* `{name}`\n"
                      f"📊 *Size:* {size}\n"
                      f"🔑 *SHA256:* `{sha_hash}`"
                  )
                  cmd = [
                      "curl", "-s",
                      "-F", f"chat_id={chat_id}",
                      "-F", f"document=@{zip_file}",
                      "-F", f"caption={caption}",
                      "-F", "parse_mode=Markdown",
                      f"https://api.telegram.org/bot{token}/sendDocument"
                  ]
                  subprocess.run(cmd)

              apks = glob.glob("release_assets/*.apk")
              for apk_file in apks:
                  name = os.path.basename(apk_file)
                  size = subprocess.check_output(["du", "-h", apk_file]).decode().split()[0]
                  caption = (
                      f"📱 *LinuxxPU Manager App!*\n\n"
                      f"⚙️ *KSU Engine:* {ksu}\n"
                      f"📦 *File:* `{name}`\n"
                      f"📊 *Size:* {size}"
                  )
                  cmd = [
                      "curl", "-s",
                      "-F", f"chat_id={chat_id}",
                      "-F", f"document=@{apk_file}",
                      "-F", f"caption={caption}",
                      "-F", "parse_mode=Markdown",
                      f"https://api.telegram.org/bot{token}/sendDocument"
                  ]
                  subprocess.run(cmd)
          EOF
