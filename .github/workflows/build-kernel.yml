name: Build Kernel & Manager Worker

on:
  workflow_call:
    inputs:
      build_target:
        required: true
        type: string
      ksu_fork:
        required: true
        type: string
      manifest_name:
        required: true
        type: string
      include_susfs:
        required: true
        type: boolean
      include_droidspace:
        required: false
        type: boolean
        default: true
      include_bbg:
        required: true
        type: boolean
      toolchain:
        required: true
        type: string
      include_lto_o3:
        required: false
        type: boolean
      include_wireguard:
        required: false
        type: boolean
      include_f2fs:
        required: false
        type: boolean
      include_zstd:
        required: false
        type: boolean
      include_bbr:
        required: false
        type: boolean
      include_ttl:
        required: false
        type: boolean
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: write

jobs:
# =========================================================================
# JOB 1: BUILD KERNEL
# =========================================================================
  build-kernel:
    if: inputs.build_target == 'both' || inputs.build_target == 'kernel_only'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: "arm64"
      KERNEL_DEFCONFIG: "camellia_defconfig"

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Send Telegram Start Notification & Save Message ID
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST: "${{ inputs.manifest_name }}"
          TARGET: "${{ inputs.build_target }}"
          KSU: "${{ inputs.ksu_fork }}"
          TOOLCHAIN: "${{ inputs.toolchain }}"
          RUN_NUM: "${{ github.run_number }}"
        run: |
          mkdir -p output_meta
          python3 << 'EOF'
          import os, json, urllib.request, urllib.parse

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST", "")
          target = os.environ.get("TARGET", "")
          ksu = os.environ.get("KSU", "")
          toolchain = os.environ.get("TOOLCHAIN", "")
          run_num = os.environ.get("RUN_NUM", "")

          # Memastikan ekstensi .xml terpasang pada nama branch/manifest
          manifest_xml = manifest if manifest.endswith(".xml") else f"{manifest}.xml"

          if token and chat_id:
              text = (
                  f"⚡ *Lotus-Kernel Build Engine Initialized*\n\n"
                  f"📱 *Device:* Redmi Note 10 5G/POCO M3 Pro 5G\n"
                  f"🌿 *Branch:* `{manifest_xml}`\n"
                  f"🎯 *Target:* {target}\n"
                  f"🔑 *KSU Engine:* {ksu}\n"
                  f"🛠️ *Toolchain:* {toolchain}\n"
                  f"🔢 *Build Run:* #{run_num}\n\n"
                  f"🔄 *Progress:* `[1/4] Preparing build dependencies...`"
              )
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              try:
                  response = urllib.request.urlopen(req)
                  res_data = json.loads(response.read().decode())
                  msg_id = res_data.get("result", {}).get("message_id")
                  if msg_id:
                      with open("output_meta/telegram_msg.id", "w") as f:
                          f.write(str(msg_id))
                      print(f"✅ Telegram Message ID saved: {msg_id}")
              except Exception as e:
                  print("Telegram notification error:", e)
          EOF

      - name: Setup Build Dependencies
        run: |
          sudo apt purge -y man-db /var/lib/man-db/auto-update || true
          sudo apt update -qq
          sudo apt install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip unzip git ccache curl aria2 jq

      - name: Download Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain

          case "${{ inputs.toolchain }}" in
            "proton-clang")
              echo "Downloading Proton-Clang..."
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
              ;;
            "zyc-clang")
              echo "Downloading ZyC Clang..."
              URL=$(curl -sSL -H "User-Agent: Mozilla/5.0" "https://gitlab.com/api/v4/projects/28003182/releases" | jq -r '.[0].assets.links[]?.url // .[0].description // empty' 2>/dev/null | grep -oE 'https://[^\s"\)]+\.tar\.(gz|xz)' | head -n 1)

              if [ -z "$URL" ]; then
                echo "⚠️ Release API blocked, attempting GitLab Package Registry..."
                PKG_DATA=$(curl -sSL -H "User-Agent: Mozilla/5.0" "https://gitlab.com/api/v4/projects/28003182/packages")
                PKG_ID=$(echo "$PKG_DATA" | jq -r '.[0].id // empty' 2>/dev/null)
                PKG_VER=$(echo "$PKG_DATA" | jq -r '.[0].version // empty' 2>/dev/null)

                if [ -n "$PKG_ID" ] && [ -n "$PKG_VER" ]; then
                  FILE_NAME=$(curl -sSL -H "User-Agent: Mozilla/5.0" "https://gitlab.com/api/v4/projects/28003182/packages/$PKG_ID/package_files" | jq -r '.[0].file_name // empty' 2>/dev/null)
                  [ -n "$FILE_NAME" ] && URL="https://gitlab.com/api/v4/projects/28003182/packages/generic/ZyC-Clang/$PKG_VER/$FILE_NAME"
                fi
              fi

              SUCCESS=false
              if [ -n "$URL" ]; then
                echo "🔗 Downloading from: $URL"
                curl -sSL -H "User-Agent: Mozilla/5.0" "$URL" -o zyc-clang.archive || true
                
                if tar -tf zyc-clang.archive >/dev/null 2>&1; then
                  echo "✅ ZyC Clang downloaded and verified!"
                  mkdir clang
                  tar -xf zyc-clang.archive -C clang --strip-components=1 2>/dev/null || tar -xf zyc-clang.archive -C clang
                  rm -f zyc-clang.archive
                  SUCCESS=true
                fi
              fi

              if [ "$SUCCESS" = false ]; then
                echo "⚠️ ZyC Clang failed/blocked. Fallback to Official AOSP Clang..."
                rm -rf clang zyc-clang.archive
                wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
                mkdir clang && tar -xf clang-r383902.tar.gz -C clang
                rm -f clang-r383902.tar.gz
              fi
              ;;
            "azure-clang")
              echo "Downloading Azure Clang..."
              git clone --depth=1 https://github.com/P3RF3CT-ST34LTH/azure-clang.git clang
              ;;
            "eva-clang")
              echo "Downloading Eva GCC / Clang..."
              git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git clang
              ;;
            *)
              echo "Downloading Official AOSP Clang..."
              wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
              mkdir clang && tar -xf clang-r383902.tar.gz -C clang
              rm -f clang-r383902.tar.gz
              ;;
          esac
          
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Sync Kernel Source from Manifest
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          export PATH=~/.bin:$PATH

          RAW_INPUT="${{ inputs.manifest_name }}"
          CLEAN_NAME="${RAW_INPUT%.xml}"
          TARGET_NAME="${CLEAN_NAME}.xml"

          echo "🔍 Mencari file manifest: $TARGET_NAME"

          FOUND_FILE=$(find "$GITHUB_WORKSPACE" -type f -iname "$TARGET_NAME" -not -path "*/.git/*" -not -path "*/toolchain/*" | head -n 1)

          if [ -z "$FOUND_FILE" ] || [ ! -f "$FOUND_FILE" ]; then
            echo "::error::File $TARGET_NAME TIDAK DITEMUKAN di GitHub Runner!"
            echo "=================================================="
            echo "📂 Daftar seluruh file yang ada di repositori kamu saat ini:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -not -path "*/.git/*" -not -path "*/toolchain/*"
            echo "=================================================="
            exit 1
          fi

          MANIFEST_PATH="$FOUND_FILE"
          echo "✅ File manifest ditemukan di: $MANIFEST_PATH"

          mkdir -p local-manifest
          cp "$MANIFEST_PATH" local-manifest/default.xml
          cd local-manifest
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add default.xml
          git commit -m "Local manifest init"
          git branch -M main
          cd ..

          repo init -u ./local-manifest -b main
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Generate Kernel Changelog & Build Metadata
        run: |
          mkdir -p output_meta
          
          if [ -d "kernel-source" ]; then
            cd kernel-source
            # 1. Buat changelog 5 commit terakhir
            git log -n 5 --pretty=format:"* %s" > ../output_meta/changelog.txt
            
            # 2. Dapatkan URL Repository Kernel dan ubah format SSH/Git ke HTTPS
            REPO_URL=$(git config --get remote.origin.url | sed 's/\.git$//' | sed 's|git@github.com:|https://github.com/|')
            
            # 3. Dapatkan nama branch aktif (dengan fallback ke manifest_name jika detached HEAD)
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
            if [ "$BRANCH_NAME" = "HEAD" ]; then
              BRANCH_NAME="${{ inputs.manifest_name }}"
              BRANCH_NAME="${BRANCH_NAME%.xml}"
            fi

            # 4. Susun link lengkap yang mengarah ke branch spesifik
            COMMIT_LINK="${REPO_URL}/commits/${BRANCH_NAME}"
            echo "$COMMIT_LINK" > ../output_meta/commit_link.txt
            cd ..
          else
            echo "* No commit log available" > output_meta/changelog.txt
            echo "" > output_meta/commit_link.txt
          fi
          
      - name: Setup KSU Fork ("${{ inputs.ksu_fork }}")
        run: |
          cd kernel-source

          # Helper function untuk manual clone & injeksi Kconfig/Makefile dengan fallback otomatis
          inject_ksu_manual() {
            local repo_url="$1"
            local branch="${2:-main}"
            echo "📥 Injecting KernelSU directly from $repo_url (Branch: $branch)..."
            rm -rf drivers/kernelsu
            
            # Coba clone repo yang diminta; jika gagal, fallback ke Official KernelSU
            if ! git clone --depth=1 -b "$branch" "$repo_url" drivers/kernelsu 2>/dev/null && \
               ! git clone --depth=1 "$repo_url" drivers/kernelsu 2>/dev/null; then
              echo "⚠️ Warning: Repositori $repo_url tidak ditemukan atau bersifat privat."
              echo "🔄 Falling back to Official KernelSU (tiann/KernelSU)..."
              git clone --depth=1 https://github.com/tiann/KernelSU.git drivers/kernelsu
            fi

            if ! grep -q "kernelsu" drivers/Kconfig; then
              sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            fi
            if ! grep -q "kernelsu" drivers/Makefile; then
              echo 'obj-y += kernelsu/' >> drivers/Makefile
            fi
          }

          # Helper function untuk mendownload setup.sh dan menangani fallback jika 404
          run_ksu_setup() {
            local setup_url="$1"
            local branch="$2"
            local repo_url="$3"

            if curl -fLSs "$setup_url" -o /tmp/ksu_setup.sh 2>/dev/null; then
              echo "🚀 Executing setup.sh from $setup_url..."
              bash /tmp/ksu_setup.sh "$branch"
              rm -f /tmp/ksu_setup.sh
            else
              echo "⚠️ setup.sh tidak ditemukan (404), beralih ke manual clone..."
              inject_ksu_manual "$repo_url" "$branch"
            fi
          }

          FORK="${{ inputs.ksu_fork }}"
          echo "⚙️ Processing KSU Fork: $FORK"

          if [ "$FORK" = "xxKSU" ]; then
            run_ksu_setup "https://raw.githubusercontent.com/backslashxx/KernelSU/main/kernel/setup.sh" "main" "https://github.com/backslashxx/KernelSU.git"
          elif [ "$FORK" = "SUKISU" ]; then
            run_ksu_setup "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" "main" "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
          elif [ "$FORK" = "ReSuKISU" ] || [ "$FORK" = "ReSukiSU" ]; then
            run_ksu_setup "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" "main" "https://github.com/ReSukiSU/ReSukiSU.git"
          elif [ "$FORK" = "KSU-Next" ]; then
            run_ksu_setup "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" "next" "https://github.com/rifs28/KernelSU-Next.git"
          else
            run_ksu_setup "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" "main" "https://github.com/tiann/KernelSU.git"
          fi

          # Validasi keberadaan folder drivers/kernelsu
          if [ ! -d "drivers/kernelsu" ]; then
            echo "❌ Error: KernelSU directory not found! Setup failed."
            exit 1
          fi

          # Patch core_hook.c / ksu_hook.c untuk Non-GKI manual hooks
          HOOK_FILES=$(find drivers/kernelsu -type f \( -name "core_hook.c" -o -name "ksu_hook.c" \))
          for HOOK_FILE in $HOOK_FILES; do
            if [ -f "$HOOK_FILE" ]; then
              echo "🔧 Patching $HOOK_FILE for Non-GKI manual hooks..."
              sed -i 's/#ifdef CONFIG_KPROBES/#if 0/g' "$HOOK_FILE"
            fi
          done

      - name: Apply Baseband-Guard (BBG)
        if: inputs.include_bbg == true
        run: |
          cd kernel-source
          echo "Applying Baseband-guard..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || true
          echo "CONFIG_BBG=y" >> arch/arm64/configs/$KERNEL_DEFCONFIG

      - name: Apply SUSFS Patch & Configs
        if: inputs.include_susfs == true
        run: |
          cd kernel-source
          echo "Applying SUSFS 4.14 Patch & Configs..."
          if [ -d "../patches/susfs_4.14" ]; then
            cp -r ../patches/susfs_4.14/* .
          fi

# -----------------------------------------------------------------
# ADVANCED FEATURE INJECTION (Including DroidSpace & SUSFS)name: 
# -----------------------------------------------------------------
      - name: Inject Selected Kernel Features
        uses: ./.github/actions/inject-features
        with:
          defconfig: ${{ env.KERNEL_DEFCONFIG }}
          enable_lto_o3: ${{ inputs.include_lto_o3 }}
          enable_wireguard: ${{ inputs.include_wireguard }}
          enable_f2fs: ${{ inputs.include_f2fs }}
          enable_zstd: ${{ inputs.include_zstd }}
          enable_bbr: ${{ inputs.include_bbr }}
          enable_ttl: ${{ inputs.include_ttl }}
          enable_droidspace: ${{ inputs.include_droidspace }}
          enable_susfs: ${{ inputs.include_susfs }}

      - name: Configure Kernel Defconfig
        run: |
          cd kernel-source
          DEFCONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG_FILE
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG_FILE

      - name: Setup & Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ inputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.toolchain }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.cache/ccache
          ccache -M 5G
          ccache -o compression=true
          ccache -z

      - name: Update Progress -> Compiling Kernel
        if: always()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST_NAME: "${{ inputs.manifest_name }}"
          KSU_FORK: "${{ inputs.ksu_fork }}"
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST_NAME", "")
          ksu = os.environ.get("KSU_FORK", "")
          msg_file = "output_meta/telegram_msg.id"

          manifest_xml = manifest if manifest.endswith(".xml") else f"{manifest}.xml"

          if token and chat_id and os.path.exists(msg_file):
              with open(msg_file, "r") as f:
                  msg_id = f.read().strip()

              text = (
                  f"⚡ *Lotus-Kernel Build Engine*\n\n"
                  f"📱 *Device:* Redmi Note 10 5G/POCO M3 Pro 5G\n"
                  f"🌿 *Branch:* `{manifest_xml}`\n"
                  f"🔑 *KSU Engine:* {ksu}\n\n"
                  f"⚙️ *Progress:* `[2/4] Compiling Kernel source with Clang...` ⏳"
              )
              data = urllib.parse.urlencode({"chat_id": chat_id, "message_id": msg_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/editMessageText", data=data)
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print("Telegram edit message error:", e)
          EOF

      - name: Build Kernel Image
        run: |
          cd kernel-source

          rm -f $GITHUB_WORKSPACE/toolchain/clang/bin/ld
          
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          export CCACHE_DIR=~/.cache/ccache
          
          make O=out ARCH=${{ env.ARCH }} $KERNEL_DEFCONFIG
          
          make -j$(nproc --all) O=out \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld

          echo "=================================================="
          echo "📊 CCACHE STATS"
          echo "=================================================="
          ccache -s

      - name: Package AnyKernel3 & Generate SHA256
        run: |
          if [ ! -d "AnyKernel3" ]; then
            echo "📥 Cloning AnyKernel3 repository..."
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi

          cd AnyKernel3

          # 1. Salin Kernel Image / DTB
          if [ -f "../kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f "../kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image.gz .
          elif [ -f "../kernel-source/out/arch/arm64/boot/Image" ]; then
            cp ../kernel-source/out/arch/arm64/boot/Image .
          else
            echo "❌ Error: Kernel Image file not found!"
            exit 1
          fi

          if [ -f "../kernel-source/out/arch/arm64/boot/dtb" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtb .
          fi

          if [ -f "../kernel-source/out/arch/arm64/boot/dtbo.img" ]; then
            cp ../kernel-source/out/arch/arm64/boot/dtbo.img .
          fi

          # 2. Variable untuk Banner & Naming
          KSU_NAME="${{ inputs.ksu_fork }}"
          [ -z "$KSU_NAME" ] && KSU_NAME="NoKSU"

          SUSFS_STATE="${{ inputs.include_susfs }}"
          [ -z "$SUSFS_STATE" ] && SUSFS_STATE="false"

          FEATURE_TAGS=""
          [ "${{ inputs.include_susfs }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-SUSFS"
          [ "${{ inputs.include_bbg }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBG"
          [ "${{ inputs.include_bbr }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBR"

          # 3. Tulis ulang anykernel.sh bersih dari awal
          cat << EOF > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script for Xiaomi Camellia (MT6833)
          # osm0sis @ xda-developers

          ## AnyKernel setup
          properties() { '
          kernel.string=Lotus Kernel for Xiaomi Camellia
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=camellia
          device.name2=camellian
          device.name3=camelliain
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          ## AnyKernel install
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching
          . tools/ak3-core.sh;

          # Print Cyber Banner
          ui_print "==================================================";
          ui_print " #    ####  ##### #   #  ###   ### #  ####  #   # ";
          ui_print " #   #    #   #   #   # #     #    # #     # #  # ";
          ui_print " #   #    #   #   #   #  ###  #    ##      #  # # ";
          ui_print " #   #    #   #   #   #     # #    # #     #   ## ";
          ui_print " ###  ####    #    ###  ####   ### #  #### #    # ";
          ui_print "==================================================";
          ui_print "               LOTUS-KERNEL CUSTOM                ";
          ui_print "==================================================";
          ui_print " [>] Device   : Xiaomi Camellia (Redmi Note 10 5G)";
          ui_print " [>] Kernel   : Linux 4.14.x";
          ui_print " [>] Engine   : ${KSU_NAME}";
          ui_print " [>] SUSFS    : ${SUSFS_STATE}";
          ui_print "==================================================";
          ui_print " ";

          # boot install
          dump_boot;
          write_boot;
          ## end boot install
          EOF

          # 4. Pack ZIP & SHA256
          ZIP_NAME="Lotus-v1-${KSU_NAME}${FEATURE_TAGS}.zip"

          zip -r9 "$ZIP_NAME" * -x ".git*" "README.md" "*.zip" "*.sha256"
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV
          echo "SHA256_PATH=AnyKernel3/${ZIP_NAME}.sha256" >> $GITHUB_ENV

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-assets
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.SHA256_PATH }}
            output_meta/*
          retention-days: 7

      - name: Send Telegram Failure Notification & Cancel Jobs
        if: failure()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST: "${{ inputs.manifest_name }}"
          KSU: "${{ inputs.ksu_fork }}"
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          python3 << 'EOF'
          import os, urllib.request, urllib.parse
          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST", "")
          ksu = os.environ.get("KSU", "")

          if token and chat_id:
              text = f"❌ *Build Kernel Failed!*\n📱 *Device:* {manifest}\n⚙️ *Fork:* {ksu}"
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              try:
                  urllib.request.urlopen(req)
              except Exception as e:
                  print("Telegram notification error:", e)
          EOF

          echo "❌ Cancelling parallel jobs due to Kernel failure..."
          gh run cancel ${{ github.run_id }}

  # =========================================================================
  # JOB 2: BUILD MANAGER APP
  # =========================================================================
  build-manager:
    needs: build-kernel
    if: |
      always() && !cancelled() && (
        inputs.build_target == 'both' || inputs.build_target == 'manager_only'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Manager Source Code ("${{ inputs.ksu_fork }}")
        run: |
          clone_repo() {
            local url=$1
            rm -rf manager-src
            echo "📥 Attempting to clone: $url"
            git clone --depth=1 --recurse-submodules "$url" manager-src
          }

          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Cloning xxKSU Manager..."
            clone_repo "https://github.com/rifs28/KernelSU-Next.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          elif [ "${{ inputs.ksu_fork }}" = "SUKISU" ]; then
            echo "Cloning SUKISU Manager..."
            clone_repo "https://github.com/SukiSU-Ultra/SukiSU-Manager.git" || \
            clone_repo "https://github.com/SukiSU-Ultra/SukiSU-Ultra.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          elif [ "${{ inputs.ksu_fork }}" = "ReSuKISU" ]; then
            echo "Cloning ReSuKISU Manager..."
            clone_repo "https://github.com/rsuntk/ReSuKISU.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          elif [ "${{ inputs.ksu_fork }}" = "KSU-Next" ]; then
            echo "Cloning KernelSU-Next Manager..."
            clone_repo "https://github.com/rifs28/KernelSU-Next.git" || \
            clone_repo "https://github.com/tiann/KernelSU.git"
          else
            echo "Cloning Official KernelSU Manager..."
            clone_repo "https://github.com/tiann/KernelSU.git"
          fi

          GW_FILE=$(find manager-src -maxdepth 3 -name "gradlew" 2>/dev/null | head -n 1)

          if [ ! -d "manager-src" ] || [ -z "$GW_FILE" ]; then
            echo "❌ Error: Failed to clone a valid Manager repository or gradlew missing!"
            exit 1
          fi

          echo "✅ Manager repository successfully cloned!"

      - name: Setup Java JDK 21 & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: 'manager-src/**/*.gradle*'

      - name: Build Manager APK via Gradle
        run: |
          GW_FILE=$(find manager-src -maxdepth 3 -name "gradlew" 2>/dev/null | head -n 1)

          if [ -z "$GW_FILE" ]; then
            echo "❌ Error: gradlew file not found in manager-src!"
            exit 1
          fi

# -------------------------------------------------------------------------
# IMPORTANT STEP: Upload APK so that it can be downloaded by Telegram Job / Release
# -------------------------------------------------------------------------
      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-apk-artifact
          path: output_apk/
          retention-days: 1

# =========================================================================
# JOB 3: PUBLISH TO GITHUB RELEASES & TELEGRAM
# =========================================================================
  publish-release:
    needs: [build-kernel, build-manager]
    if: |
      always() && !cancelled() && (
        (inputs.build_target == 'both' && needs.build-kernel.result == 'success' && needs.build-manager.result == 'success') ||
        (inputs.build_target == 'kernel_only' && needs.build-kernel.result == 'success') ||
        (inputs.build_target == 'manager_only' && needs.build-manager.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Prepare Release Environment
        run: |
          DATE_TAG=$(date +'%Y%m%d-%H%M')
          echo "DATE_TAG=$DATE_TAG" >> $GITHUB_ENV

          ZIP_FILE=$(find release_assets -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            ZIP_NAME=$(basename "$ZIP_FILE")
            echo "RELEASE_TITLE=Lotus Kernel - $ZIP_NAME" >> $GITHUB_ENV
          else
            echo "RELEASE_TITLE=Lotus Build Release v$DATE_TAG" >> $GITHUB_ENV
          fi

          SHA_FILE=$(find release_assets -type f -name "*.sha256" | head -n 1)
          if [ -n "$SHA_FILE" ]; then
            echo "SHA256_CONTENT=$(cat "$SHA_FILE")" >> $GITHUB_ENV
          else
            echo "SHA256_CONTENT=N/A" >> $GITHUB_ENV
          fi

          CHANGELOG_FILE=$(find release_assets -type f -name "changelog.txt" | head -n 1)
          if [ -n "$CHANGELOG_FILE" ] && [ -f "$CHANGELOG_FILE" ]; then
            EOF_MARKER="EOF_$(date +%s)"
            echo "CHANGELOG_BODY<<$EOF_MARKER" >> $GITHUB_ENV
            cat "$CHANGELOG_FILE" >> $GITHUB_ENV
            echo "" >> $GITHUB_ENV  # Memastikan newline sebelum delimiter penutup
            echo "$EOF_MARKER" >> $GITHUB_ENV
          else
            echo "CHANGELOG_BODY=* No commit log available" >> $GITHUB_ENV
          fi

          LINK_FILE=$(find release_assets -type f -name "commit_link.txt" | head -n 1)
          if [ -n "$LINK_FILE" ] && [ -f "$LINK_FILE" ]; then
            echo "COMMIT_LINK=$(cat "$LINK_FILE")" >> $GITHUB_ENV
          else
            echo "COMMIT_LINK=" >> $GITHUB_ENV
          fi

      - name: Auto-Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.DATE_TAG }}
          name: "${{ env.RELEASE_TITLE }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ⚡ **Lotus-V1 Kernel Ready!**

            📱 **Device:** Redmi Note 10 5G / Poco M3 Pro 5G (`camellia`/`camellian`)
            ⚙️ **KSU Engine:** `${{ inputs.ksu_fork }}`

            🛠️ **Active Features:**
            * KernelSU Engine: `${{ inputs.ksu_fork }}`
            * SUSFS Anti-Detection: `${{ inputs.include_susfs }}`
            * DroidSpace & OverlayFS: `${{ inputs.include_droidspace }}`
            * Baseband-Guard: `${{ inputs.include_bbg }}`
            * ThinLTO & -O3: `${{ inputs.include_lto_o3 }}`
            * WireGuard: `${{ inputs.include_wireguard }}`
            * F2FS Backport: `${{ inputs.include_f2fs }}`
            * ZRAM ZSTD: `${{ inputs.include_zstd }}`
            * TCP BBR: `${{ inputs.include_bbr }}`
            * TTL Spoofing: `${{ inputs.include_ttl }}`

            📋 **Recent Commits:**
            ${{ env.CHANGELOG_BODY }}
            🔗 [View Full Commit History](${{ env.COMMIT_LINK }})

            ---
            *📦 File SHA256 Checksum:*
            ```text
            ${{ env.SHA256_CONTENT }}
            ```
          files: |
            release_assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Built Files (Kernel & Manager) to Telegram
        if: success()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST: "${{ inputs.manifest_name }}"
          KSU: "${{ inputs.ksu_fork }}"
          SUSFS: "${{ inputs.include_susfs }}"
          DROIDSPACE: "${{ inputs.include_droidspace }}"
          BBG: "${{ inputs.include_bbg }}"
          LTO: "${{ inputs.include_lto_o3 }}"
          WG: "${{ inputs.include_wireguard }}"
          F2FS: "${{ inputs.include_f2fs }}"
          ZSTD: "${{ inputs.include_zstd }}"
          BBR: "${{ inputs.include_bbr }}"
          TTL: "${{ inputs.include_ttl }}"
        run: |
          python3 << 'EOF'
          import os, glob, subprocess

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST", "")
          ksu = os.environ.get("KSU", "")

          susfs = os.environ.get("SUSFS") == "true"
          droidspace = os.environ.get("DROIDSPACE") == "true"
          bbg = os.environ.get("BBG") == "true"
          lto = os.environ.get("LTO") == "true"
          wg = os.environ.get("WG") == "true"
          f2fs = os.environ.get("F2FS") == "true"
          zstd = os.environ.get("ZSTD") == "true"
          bbr = os.environ.get("BBR") == "true"
          ttl = os.environ.get("TTL") == "true"

          feature_list = [
              f"KernelSU Engine: {ksu}",
              f"SUSFS Anti-Detection: {str(susfs).lower()}",
              f"DroidSpace & OverlayFS: {str(droidspace).lower()}",
              f"Baseband-Guard: {str(bbg).lower()}",
              f"ThinLTO & -O3: {str(lto).lower()}",
              f"WireGuard: {str(wg).lower()}",
              f"F2FS Backport: {str(f2fs).lower()}",
              f"ZRAM ZSTD: {str(zstd).lower()}",
              f"TCP BBR: {str(bbr).lower()}",
              f"TTL Spoofing: {str(ttl).lower()}"
          ]
          feature_str = "\n".join([f"• {f}" for f in feature_list])

          changelog_str = ""
          cl_files = glob.glob("release_assets/**/changelog.txt", recursive=True)
          if cl_files and os.path.exists(cl_files[0]):
              with open(cl_files[0], "r") as f:
                  changelog_str = f.read().strip()
                  # Truncate changelog jika terlalu panjang agar tidak melebihi limit Telegram (1024 char caption)
                  if len(changelog_str) > 300:
                      changelog_str = changelog_str[:300] + "\n... (truncated)"

          commit_link = ""
          link_files = glob.glob("release_assets/**/commit_link.txt", recursive=True)
          if link_files and os.path.exists(link_files[0]):
              with open(link_files[0], "r") as f:
                  commit_link = f.read().strip()

          if token and chat_id:
              zips = glob.glob("release_assets/**/*.zip", recursive=True)
              print(f"📦 Found ZIP files: {zips}")
              for zip_file in zips:
                  name = os.path.basename(zip_file)
                  size = subprocess.check_output(["du", "-h", zip_file]).decode().split()[0]
                  
                  sha_hash = "N/A"
                  sha_matches = glob.glob(f"release_assets/**/{name}.sha256", recursive=True)
                  if sha_matches and os.path.exists(sha_matches[0]):
                      with open(sha_matches[0], "r") as f:
                          sha_hash = f.read().strip().split()[0]

                  link_md = f"\n🔗 [View Full Commit History]({commit_link})" if commit_link else ""

                  caption = (
                      f"⚡ *Lotus-V1-{ksu} Kernel Ready!*\n\n"
                      f"📱 *Device:* Redmi Note 10 5G / Poco M3 Pro 5G (camellia/camellian)\n"
                      f"⚙️ *KSU Engine:* {ksu}\n\n"
                      f"🛠️ *Active Features:*\n{feature_str}\n\n"
                      f"📋 *Recent Commits:*\n{changelog_str}{link_md}\n\n"
                      f"📦 *File:* `{name}`\n"
                      f"📊 *Size:* {size}\n"
                      f"🔑 *SHA256:* `{sha_hash}`"
                  )
                  cmd = [
                      "curl", "-s",
                      "-F", f"chat_id={chat_id}",
                      "-F", f"document=@{zip_file}",
                      "-F", f"caption={caption}",
                      "-F", "parse_mode=Markdown",
                      f"https://api.telegram.org/bot{token}/sendDocument"
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  print(f"✅ Telegram Kernel Sent: {name} | Response: {res.stdout}")

              apks = glob.glob("release_assets/**/*.apk", recursive=True)
              print(f"📱 Found APK files: {apks}")
              for apk_file in apks:
                  name = os.path.basename(apk_file)
                  size = subprocess.check_output(["du", "-h", apk_file]).decode().split()[0]
                  caption = (
                      f"📱 *KSU Manager App!*\n\n"
                      f"⚙️ *KSU Engine:* {ksu}\n"
                      f"📦 *File:* `{name}`\n"
                      f"📊 *Size:* {size}"
                  )
                  cmd = [
                      "curl", "-s",
                      "-F", f"chat_id={chat_id}",
                      "-F", f"document=@{apk_file}",
                      "-F", f"caption={caption}",
                      "-F", "parse_mode=Markdown",
                      f"https://api.telegram.org/bot{token}/sendDocument"
                  ]
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  print(f"✅ Telegram Manager Sent: {name} | Response: {res.stdout}")
          else:
              print("⚠️ Telegram Token or Chat ID is missing!")
          EOF

      - name: Update Progress -> Complete
        if: success()
        env:
          TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
          MANIFEST_NAME: "${{ inputs.manifest_name }}"
          KSU_FORK: "${{ inputs.ksu_fork }}"
        run: |
          python3 << 'EOF'
          import os, glob, urllib.request, urllib.parse

          token = os.environ.get("TELEGRAM_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          manifest = os.environ.get("MANIFEST_NAME", "")
          ksu = os.environ.get("KSU_FORK", "")

          manifest_xml = manifest if manifest.endswith(".xml") else f"{manifest}.xml"
          msg_files = glob.glob("release_assets/**/telegram_msg.id", recursive=True)

          if token and chat_id and msg_files:
              msg_file = msg_files[0]
              with open(msg_file, "r") as f:
                  msg_id = f.read().strip()

              text = (
                  f"✅ *Lotus-Kernel Build Finished Successfully!*\n\n"
                  f"📱 *Device:* Redmi Note 10 5G/POCO M3 Pro 5G\n"
                  f"🌿 *Branch:* `{manifest_xml}`\n"
                  f"⚙️ *KSU Engine:* {ksu}\n\n"
                  f"🎉 *Progress:* `[4/4] Release assets uploaded & sent below!`"
              )
              data = urllib.parse.urlencode({"chat_id": chat_id, "message_id": msg_id, "text": text, "parse_mode": "Markdown"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/editMessageText", data=data)
              try:
                  res = urllib.request.urlopen(req)
                  print(f"✅ Telegram progress message #{msg_id} updated successfully!")
              except Exception as e:
                  print("Telegram finish notification error:", e)
          EOF
          
