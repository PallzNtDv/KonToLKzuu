name: Build Kernel & Manager Worker

on:
  workflow_call:
    inputs:
      build_target:
        required: true
        type: string
      ksu_fork:
        required: true
        type: string
      manifest_name:
        required: true
        type: string
      include_extra_features:
        required: true
        type: boolean
      toolchain:
        required: true
        type: string

permissions:
  contents: write

jobs:
  # =========================================================================
  # JOB 1: BUILD KERNEL
  # =========================================================================
  build-kernel:
    if: inputs.build_target == 'both' || inputs.build_target == 'kernel_only'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: "arm64"
      KERNEL_DEFCONFIG: "camellia_defconfig"

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Telegram Build Start Notification ---
      - name: Send Telegram Start Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANIFEST_NAME: ${{ inputs.manifest_name }}
          BUILD_TARGET: ${{ inputs.build_target }}
          KSU_FORK: ${{ inputs.ksu_fork }}
          TOOLCHAIN: ${{ inputs.toolchain }}
          EXTRA_FEATURES: ${{ inputs.include_extra_features }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MESSAGE=$(cat << EOF
          ⚡ *LinuxxPU Build Engine Initialized*

          ━━━━━━━━━━━━━━━━━━━━━━━━━
          📱 *Device Target:* \`$MANIFEST_NAME\`
          🎯 *Build Target:* \`$BUILD_TARGET\`
          🔑 *KSU Engine:* \`$KSU_FORK\`
          🛠️ *Toolchain:* \`$TOOLCHAIN\`
          🛡️ *SUSFS & BBG:* \`$EXTRA_FEATURES\`
          🔢 *Build Run:* \`#$RUN_NUMBER\`
          ━━━━━━━━━━━━━━━━━━━━━━━━━
          ⚙️ *Status:* \`Compiling source code...\`

          🔗 [View Live Workflow Log](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"

      - name: Setup Build Dependencies
        run: |
          sudo apt purge -y man-db /var/lib/man-db/auto-update || true
          sudo apt update -qq
          sudo apt install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip unzip git ccache curl aria2

      - name: Download Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain
          
          if [ "${{ inputs.toolchain }}" = "proton-clang" ]; then
            echo "Downloading Proton-Clang..."
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          else
            echo "Downloading Official AOSP Clang..."
            wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
            mkdir clang && tar -xf clang-r383902.tar.gz -C clang
          fi
          
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Sync Kernel Source from Manifest
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          export PATH=~/.bin:$PATH

          SEARCH_TARGET="${{ inputs.manifest_name }}.xml"
          FOUND_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -iname "$SEARCH_TARGET" | head -n 1)

          if [ -z "$FOUND_FILE" ] || [ ! -f "$FOUND_FILE" ]; then
            echo "::error::File $SEARCH_TARGET TIDAK DITEMUKAN di repositori!"
            echo "--- ISI STRUKTUR REPOSITORI SAAT INI ---"
            ls -la "$GITHUB_WORKSPACE"
            ls -la "$GITHUB_WORKSPACE/.github" || true
            exit 1
          fi

          MANIFEST_PATH="$FOUND_FILE"
          echo "✅ Menggunakan manifest dari: $MANIFEST_PATH"

          mkdir -p local-manifest
          cp "$MANIFEST_PATH" local-manifest/default.xml
          cd local-manifest
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add default.xml
          git commit -m "Local manifest init"
          git branch -M main
          cd ..

          repo init -u ./local-manifest -b main
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Setup KSU Fork (${{ inputs.ksu_fork }})
        run: |
          cd kernel-source
          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Setting up xxKSU..."
            curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/main/kernel/setup.sh" | bash -s main || \
            curl -fLSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -s master
          elif [ "${{ inputs.ksu_fork }}" = "SUKISU" ]; then
            echo "Setting up SUKISU..."
            curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main || \
            curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/master/kernel/setup.sh" | bash -s master
          else
            echo "Setting up Official KernelSU..."
            curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main || \
            curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/master/kernel/setup.sh" | bash -s master
          fi

          HOOK_FILE="drivers/kernelsu/core_hook.c"
          if [ -f "$HOOK_FILE" ]; then
            echo "Patching core_hook.c untuk manual hooks Non-GKI..."
            sed -i 's/#ifdef CONFIG_KPROBES/#if 0/g' "$HOOK_FILE"
          fi

      - name: Apply Baseband-Guard (BBG)
        if: inputs.include_extra_features == true
        run: |
          cd kernel-source
          echo "Memasang Baseband-guard..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash || true
          echo "CONFIG_BBG=y" >> arch/arm64/configs/$KERNEL_DEFCONFIG

      - name: Apply SUSFS Patch & Configs
        if: inputs.include_extra_features == true
        run: |
          cd kernel-source
          echo "Memasang SUSFS 4.14 Patch & Configs..."
          if [ -d "../patches/susfs_4.14" ]; then
            cp -r ../patches/susfs_4.14/* .
          fi

          DEFCONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG_FILE

      - name: Configure Kernel Defconfig
        run: |
          cd kernel-source
          DEFCONFIG_FILE="arch/arm64/configs/$KERNEL_DEFCONFIG"
          
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_TMPFS_XATTR=y" >> $DEFCONFIG_FILE
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> $DEFCONFIG_FILE

      - name: Build Kernel Image
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          
          make O=out ARCH=${{ env.ARCH }} $KERNEL_DEFCONFIG
          make -j$(nproc --all) O=out \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          sed -i 's/device.name1=.*/device.name1=camellia/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=camellian/' AnyKernel3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|' AnyKernel3/anykernel.sh
          
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          cd AnyKernel3
          zip -r9 ../LinuxxPU-${{ inputs.manifest_name }}-${{ inputs.ksu_fork }}.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxxPU-${{ inputs.manifest_name }}-${{ inputs.ksu_fork }}
          path: LinuxxPU-${{ inputs.manifest_name }}-${{ inputs.ksu_fork }}.zip

      - name: Send Telegram Failure Notification (Kernel)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=❌ *Build Kernel Failed!*%0A📱 *Device:* ${{ inputs.manifest_name }}%0A⚙️ *Fork:* ${{ inputs.ksu_fork }}"

  # =========================================================================
  # JOB 2: BUILD MANAGER APP
  # =========================================================================
  build-manager:
    if: inputs.build_target == 'both' || inputs.build_target == 'manager_only'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Telegram Build Start Notification (Manager Only) ---
      - name: Send Telegram Start Notification (Manager Only)
        if: inputs.build_target == 'manager_only'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANIFEST_NAME: ${{ inputs.manifest_name }}
          BUILD_TARGET: ${{ inputs.build_target }}
          KSU_FORK: ${{ inputs.ksu_fork }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MESSAGE=$(cat << EOF
          ⚡ *LinuxxPU Build Engine Initialized*

          ━━━━━━━━━━━━━━━━━━━━━━━━━
          📱 *Device Target:* \`$MANIFEST_NAME\`
          🎯 *Build Target:* \`$BUILD_TARGET\`
          🔑 *KSU Engine:* \`$KSU_FORK\`
          🔢 *Build Run:* \`#$RUN_NUMBER\`
          ━━━━━━━━━━━━━━━━━━━━━━━━━
          ⚙️ *Status:* \`Compiling Manager APK...\`

          🔗 [View Live Workflow Log](https://github.com/$REPOSITORY/actions/runs/$RUN_ID)
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone Manager Source Code (${{ inputs.ksu_fork }})
        run: |
          rm -rf manager-src
          if [ "${{ inputs.ksu_fork }}" = "xxKSU" ]; then
            echo "Cloning xxKSU Manager..."
            git clone --depth=1 https://github.com/backslashxx/KernelSU.git manager-src
          elif [ "${{ inputs.ksu_fork }}" = "SUKISU" ]; then
            echo "Cloning SUKISU Manager..."
            git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Manager.git manager-src || git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git manager-src
          else
            echo "Cloning Official KernelSU Manager..."
            git clone --depth=1 https://github.com/tiann/KernelSU.git manager-src
          fi

      - name: Build Manager APK via Gradle
        run: |
          GRADLE_DIR=$(find manager-src -maxdepth 3 -name "gradlew" -exec dirname {} \;)

          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: File gradlew tidak ditemukan!"
            exit 1
          fi

          echo "Lokasi Gradle project ditemukan di: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Organize APK Artifact
        run: |
          mkdir -p output_apk
          APK_FILE=$(find manager-src -name "*.apk" | grep -i "release" | head -n 1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "APK ditemukan di: $APK_FILE"
            cp "$APK_FILE" "output_apk/${{ inputs.ksu_fork }}-Manager-Release.apk"
          else
            echo "Error: File APK hasil kompilasi tidak ditemukan!"
            exit 1
          fi

      - name: Upload Manager APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ksu_fork }}-Manager-APK
          path: output_apk/${{ inputs.ksu_fork }}-Manager-Release.apk

      - name: Send Telegram Failure Notification (Manager)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=❌ *Build Manager Failed!*%0A⚙️ *Fork:* ${{ inputs.ksu_fork }}"

  # =========================================================================
  # JOB 3: PUBLISH TO GITHUB RELEASES & TELEGRAM
  # =========================================================================
  publish-release:
    needs: [build-kernel, build-manager]
    if: always() && !cancelled() && (needs.build-kernel.result == 'success' || needs.build-manager.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ inputs.manifest_name }}-${{ inputs.ksu_fork }}-${{ github.run_number }}
          name: "Build #${{ github.run_number }} - ${{ inputs.manifest_name }} (${{ inputs.ksu_fork }})"
          body: |
            ### 🚀 Kernel & Manager Build Details
            - **Device Manifest**: `${{ inputs.manifest_name }}`
            - **KernelSU Fork**: `${{ inputs.ksu_fork }}`
            - **Build Target**: `${{ inputs.build_target }}`
            - **Toolchain**: `${{ inputs.toolchain }}`
            - **Extra Features (SUSFS & BBG)**: `${{ inputs.include_extra_features }}`
          files: |
            release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Built Files (Kernel & Manager) to Telegram
        if: success()
        run: |
          TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          
          KERNEL_ZIP=$(find release_assets -type f -name "*.zip" | head -n 1)
          MANAGER_APK=$(find release_assets -type f -name "*.apk" | head -n 1)

          if [ -f "$KERNEL_ZIP" ]; then
            ZIP_NAME=$(basename "$KERNEL_ZIP")
            ZIP_SIZE=$(du -h "$KERNEL_ZIP" | cut -f1)
            
            echo "Sending Kernel Zip to Telegram..."
            curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$KERNEL_ZIP" \
                 -F caption="⚡ *LinuxxPU Kernel Ready!*%0A%0A📱 *Device:* ${{ inputs.manifest_name }}%0A⚙️ *KSU Fork:* ${{ inputs.ksu_fork }}%0A📦 *File:* \`$ZIP_NAME\`%0A📊 *Size:* $ZIP_SIZE" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot${TOKEN}/sendDocument"
          fi

          if [ -f "$MANAGER_APK" ]; then
            APK_NAME=$(basename "$MANAGER_APK")
            APK_SIZE=$(du -h "$MANAGER_APK" | cut -f1)
            
            echo "Sending Manager APK to Telegram..."
            curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$MANAGER_APK" \
                 -F caption="📱 *LinuxxPU Manager App!*%0A%0A⚙️ *Fork:* ${{ inputs.ksu_fork }}%0A📦 *File:* \`$APK_NAME\`%0A📊 *Size:* $APK_SIZE" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot${TOKEN}/sendDocument"
          fi
