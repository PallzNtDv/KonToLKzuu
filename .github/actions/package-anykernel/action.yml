name: "Package AnyKernel3"
description: "Package built kernel into AnyKernel3 zip archive and generate SHA256 checksum"
inputs:
  ksu_fork:
    description: "KernelSU engine used"
    required: false
    default: ""
  include_susfs:
    description: "Include SuSFS flag"
    required: false
    default: "false"
  include_bbg:
    description: "Include BBG flag"
    required: false
    default: "false"
  include_bbr:
    description: "Include BBR flag"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Package AnyKernel3 & Generate SHA256
      shell: bash
      run: |
        if [ ! -d "AnyKernel3" ]; then
          echo "📥 Cloning AnyKernel3 repository..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        fi

        cd AnyKernel3

        if [ -f "../kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
        elif [ -f "../kernel-source/out/arch/arm64/boot/Image.gz" ]; then
          cp ../kernel-source/out/arch/arm64/boot/Image.gz .
        elif [ -f "../kernel-source/out/arch/arm64/boot/Image" ]; then
          cp ../kernel-source/out/arch/arm64/boot/Image .
        else
          echo "❌ Error: Kernel Image file not found!"
          exit 1
        fi

        if [ -f "../kernel-source/out/arch/arm64/boot/dtb" ]; then
          cp ../kernel-source/out/arch/arm64/boot/dtb .
        fi

        if [ -f "../kernel-source/out/arch/arm64/boot/dtbo.img" ]; then
          cp ../kernel-source/out/arch/arm64/boot/dtbo.img .
        fi

        KSU_NAME="${{ inputs.ksu_fork }}"
        [ -z "$KSU_NAME" ] && KSU_NAME="NoKSU"

        SUSFS_STATE="${{ inputs.include_susfs }}"
        [ -z "$SUSFS_STATE" ] && SUSFS_STATE="false"

        FEATURE_TAGS=""
        [ "${{ inputs.include_susfs }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-SUSFS"
        [ "${{ inputs.include_bbg }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBG"
        [ "${{ inputs.include_bbr }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBR"

        cat << '        EOF_AK3' | sed 's/^        //' > anykernel.sh
        # AnyKernel3 Ramdisk Mod Script for Xiaomi Camellia (MT6833)
        # osm0sis @ xda-developers

        ## AnyKernel setup
        properties() { '
        kernel.string=Lotus Kernel for Xiaomi Camellia
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=camellia
        device.name2=camellian
        supported.versions=
        supported.patchlevels=
        '; } # end properties

        ## AnyKernel install
        boot_attributes() {
        set_perm_recursive 0 0 755 644 $RAMDISK/*;
        set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
        } # end attributes

        # boot shell variables (Wajib huruf kecil agar tidak error OMAP)
        block=auto;
        is_slot_device=auto;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        # import functions/variables and setup patching
        . tools/ak3-core.sh;

        # Print Cyber Banner
        ui_print "==================================================";
        ui_print " #    ####  ##### #   #  ###   ### #  ####  #   # ";
        ui_print " #   #    #   #   #   # #     #    # #     # #  # ";
        ui_print " #   #    #   #   #   #  ###  #    ##      #  # # ";
        ui_print " #   #    #   #   #   #     # #    # #     #   ## ";
        ui_print " ###  ####    #    ###  ####   ### #  #### #    # ";
        ui_print "==================================================";
        ui_print "               LOTUS-KERNEL CUSTOM                ";
        ui_print "==================================================";
        ui_print " [>] Device   : Xiaomi Camellia (Redmi Note 10 5G)";
        ui_print " [>] Kernel   : Linux 4.14.x";
        ui_print "==================================================";

        # Eksekusi Patching & Flashing Boot
        split_boot;
        flash_boot;
        flash_dtbo;
        EOF_AK3

        # Kompresi file ke AnyKernel3 ZIP & Buat SHA256
        ZIP_NAME="LotusKernel-Camellia-${KSU_NAME}${FEATURE_TAGS}-$(date +%Y%m%d_%H%M).zip"
        zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder

        cd ..
        sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
        echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
