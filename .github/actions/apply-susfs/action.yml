name: "Apply SUSFS Patch & Configs"
description: "Penerapan patch SuSFS 4.14, setup header susfs.h/susfs_def.h, dan pencatatan susfs.c"

runs:
  using: "composite"
  steps:
    - name: Apply SUSFS Patch & Configs
      shell: bash
      run: |
        cd kernel-source
        echo "Applying SUSFS 4.14 Patch & Configs..."
        
        mkdir -p ../patches/susfs_4.14
        mkdir -p include/linux

        # 1. Unduh patch resmi 4.14 jika belum ada
        if [ -z "$(ls -A ../patches/susfs_4.14/*.patch 2>/dev/null)" ]; then
          echo "📥 Downloading SUSFS 4.14 patch..."
          curl -fsSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.14/kernel_patches/50_add_susfs_in_kernel-4.14.patch" \
            -o ../patches/susfs_4.14/50_add_susfs_in_kernel-4.14.patch || true
        fi

        # Bersihkan file patch jika terunduh sebagai HTML / 404
        for f in ../patches/susfs_4.14/*; do
          if [ -f "$f" ] && (grep -q -iE "<!DOCTYPE|<html|404" "$f" 2>/dev/null); then
            echo "⚠️ Cleaning corrupted patch file: $f"
            rm -f "$f"
          fi
        done

        # 2. Eksekusi patch ke dalam source code kernel C
        for patch_file in ../patches/susfs_4.14/*.patch ../patches/susfs_4.14/*.diff; do
          if [ -f "$patch_file" ]; then
            echo "🛠️ Applying patch: $patch_file"
            patch -p1 < "$patch_file" || git apply "$patch_file" || true
          fi
        done

        # 3. Penanganan include/linux/susfs.h secara ketat
        echo "📥 Setting up include/linux/susfs.h..."
        mkdir -p include/linux

        if [ -f "include/linux/susfs.h" ] && (grep -q -iE "<!DOCTYPE|<html|404" include/linux/susfs.h 2>/dev/null); then
          rm -f include/linux/susfs.h
        fi

        # Prioritas 1: Cari dari repositori lokal (drivers/kernelsu dll)
        LOCAL_SUSFS_H=$(find . -type f -name "susfs.h" ! -path "./include/linux/susfs.h" 2>/dev/null | head -n 1)
        if [ -n "$LOCAL_SUSFS_H" ] && [ -f "$LOCAL_SUSFS_H" ]; then
          echo "🔍 Found local susfs.h at: $LOCAL_SUSFS_H, copying to include/linux/..."
          cp -f "$LOCAL_SUSFS_H" include/linux/susfs.h
        fi

        # Prioritas 2: Unduh dari daftar URL fallback
        if [ ! -f "include/linux/susfs.h" ]; then
          echo "📥 Fetching susfs.h from remote mirrors..."
          curl -fsSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.14/kernel_patches/include/linux/susfs.h" -o include/linux/susfs.h 2>/dev/null || \
          curl -fsSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.14/include/linux/susfs.h" -o include/linux/susfs.h 2>/dev/null || \
          curl -fsSL "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/include/linux/susfs.h" -o include/linux/susfs.h 2>/dev/null || true
        fi

        # Prioritas 3: Failsafe jika susfs.h tetap tidak ditemukan
        if [ ! -f "include/linux/susfs.h" ] || (grep -q -iE "<!DOCTYPE|<html|404" include/linux/susfs.h 2>/dev/null); then
          echo "🔧 Creating fallback include/linux/susfs.h..."
          printf '%s\n' \
            '#ifndef _LINUX_SUSFS_H' \
            '#define _LINUX_SUSFS_H' \
            '' \
            '#include <linux/susfs_def.h>' \
            '' \
            '#endif /* _LINUX_SUSFS_H */' > include/linux/susfs.h
        fi

        # 4. Penanganan fs/susfs.c secara ketat
        echo "📥 Setting up fs/susfs.c..."
        if [ -f "fs/susfs.c" ] && (grep -q -iE "<!DOCTYPE|<html|404" fs/susfs.c 2>/dev/null); then
          rm -f fs/susfs.c
        fi

        LOCAL_SUSFS_C=$(find . -type f -name "susfs.c" ! -path "./fs/susfs.c" 2>/dev/null | head -n 1)
        if [ -n "$LOCAL_SUSFS_C" ] && [ -f "$LOCAL_SUSFS_C" ]; then
          echo "🔍 Found local susfs.c at: $LOCAL_SUSFS_C, copying to fs/..."
          cp -f "$LOCAL_SUSFS_C" fs/susfs.c
        fi

        if [ ! -f "fs/susfs.c" ]; then
          echo "📥 Fetching susfs.c from remote mirror..."
          curl -fsSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.14/kernel_patches/fs/susfs.c" -o fs/susfs.c 2>/dev/null || \
          curl -fsSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/kernel-4.14/fs/susfs.c" -o fs/susfs.c 2>/dev/null || \
          curl -fsSL "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/fs/susfs.c" -o fs/susfs.c 2>/dev/null || true
        fi

        # 5. Buat include/linux/susfs_def.h bersih beserta makro lengkap secara langsung
        echo "🔧 Generating complete include/linux/susfs_def.h directly..."
        printf '%s\n' \
          '#ifndef _SUSFS_DEF_H' \
          '#define _SUSFS_DEF_H' \
          '' \
          '#include <linux/types.h>' \
          '' \
          '#ifndef SUSFS_MAX_LEN_PATHNAME' \
          '#define SUSFS_MAX_LEN_PATHNAME 512' \
          '#endif' \
          '' \
          '#ifndef SUSFS_FAKE_CMDLINE_OR_BOOTCONFIG_SIZE' \
          '#define SUSFS_FAKE_CMDLINE_OR_BOOTCONFIG_SIZE 2048' \
          '#endif' \
          '' \
          '#ifndef TASK_STRUCT_NON_ROOT_USER_APP_PROC' \
          '#define TASK_STRUCT_NON_ROOT_USER_APP_PROC (1 << 0)' \
          '#endif' \
          '' \
          '#ifndef INODE_STATE_SUS_KSTAT' \
          '#define INODE_STATE_SUS_KSTAT (1 << 0)' \
          '#endif' \
          '' \
          '#ifndef INODE_STATE_SUS_PATH' \
          '#define INODE_STATE_SUS_PATH (1 << 1)' \
          '#endif' \
          '' \
          '#ifndef INODE_STATE_SUS_MOUNT' \
          '#define INODE_STATE_SUS_MOUNT (1 << 2)' \
          '#endif' \
          '' \
          '#ifndef INODE_STATE_OPEN_REDIRECT' \
          '#define INODE_STATE_OPEN_REDIRECT (1 << 3)' \
          '#endif' \
          '' \
          '#ifndef DEFAULT_SUS_MNT_ID' \
          '#define DEFAULT_SUS_MNT_ID 100000' \
          '#endif' \
          '' \
          '#ifndef DEFAULT_SUS_MNT_GROUP_ID' \
          '#define DEFAULT_SUS_MNT_GROUP_ID 100000' \
          '#endif' \
          '' \
          '#ifndef DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE' \
          '#define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE 99999' \
          '#endif' \
          '' \
          '#endif /* _SUSFS_DEF_H */' > include/linux/susfs_def.h

        # 6. Pastikan include/linux/susfs.h meng-include susfs_def.h
        if [ -f "include/linux/susfs.h" ] && ! grep -q "susfs_def.h" include/linux/susfs.h; then
          echo "🔧 Injecting #include <linux/susfs_def.h> into include/linux/susfs.h"
          sed -i '1i#include <linux/susfs_def.h>' include/linux/susfs.h
        fi

        # 7. Mass-inject #include <linux/susfs_def.h> ke seluruh file C patched
        echo "🔧 Mass injecting #include <linux/susfs_def.h> into all patched C files..."
        grep -rl "susfs" fs/ kernel/ drivers/ 2>/dev/null | grep "\.c$" | while read -r file; do
          if ! grep -q "linux/susfs_def.h" "$file"; then
            echo "  -> Injecting header into $file"
            sed -i '1i#include <linux/susfs_def.h>' "$file"
          fi
        done

        echo "✅ Verification complete:"
        ls -la include/linux/susfs* || true
        ls -la fs/susfs.c || true
        
